<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YouTube Live Stream Scanner</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
          </div>
          <div class="logo-text">
            <h1>Stream Scanner</h1>
            <p class="tagline">YouTube Live Discovery</p>
          </div>
        </div>
        <div class="header-status">
          <span id="status" class="status-badge"></span>
        </div>
      </div>
    </header>

    <section class="controls-section">
      <div class="controls-container">
        <div class="search-group">
          <label class="input-label" for="keywords">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input type="text" id="keywords" class="search-input" placeholder="Enter keywords (comma-separated)" />
          </label>
        </div>

        <div class="options-group">
          <label class="select-label">
            <span class="label-text">Results</span>
            <select id="max" class="select-input">
              <option value="10">10</option>
              <option value="25" selected>25</option>
              <option value="50">50</option>
            </select>
          </label>

          <label class="select-label">
            <span class="label-text">Min Viewers</span>
            <input type="number" id="minViewers" class="number-input" placeholder="0" min="0" value="0" />
          </label>

          <label class="select-label">
            <span class="label-text">Max Viewers</span>
            <input type="number" id="maxViewers" class="number-input" placeholder="No limit" min="0" value="0" />
          </label>

          <label class="select-label">
            <span class="label-text">Auto-refresh</span>
            <select id="refreshSec" class="select-input">
              <option value="0">Off</option>
              <option value="10">10s</option>
              <option value="20" selected>20s</option>
              <option value="30">30s</option>
              <option value="60">60s</option>
            </select>
          </label>

          <button id="scanBtn" class="scan-button">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 4v6h6"></path>
              <path d="M23 20v-6h-6"></path>
              <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
            </svg>
            <span>Scan Now</span>
          </button>
        </div>
      </div>
    </section>

    <section id="blockedSection" class="blocked-section" style="display:none;">
      <div class="blocked-container">
        <div class="blocked-header">
          <h3 class="blocked-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
            </svg>
            Blocked Channels
          </h3>
          <button id="clearBlockedBtn" class="clear-blocked-btn">Clear All</button>
        </div>
        <div id="blockedList" class="blocked-list"></div>
      </div>
    </section>

    <main class="main-content">
      <div id="results" class="results-grid">
        <div class="empty-state">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <path d="M8 21h8"></path>
              <path d="M12 17v4"></path>
              <polygon points="10 8 16 11.5 10 15 10 8" fill="currentColor" stroke="none"></polygon>
            </svg>
          </div>
          <h3>Ready to Scan</h3>
          <p>Enter keywords and click "Scan Now" to discover live streams</p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>Powered by YouTube Data API v3</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
