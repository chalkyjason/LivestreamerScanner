<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YouTube Live Stream Scanner</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
          </div>
          <div class="logo-text">
            <h1>Stream Scanner</h1>
            <p class="tagline">YouTube Live Discovery</p>
          </div>
        </div>
        <div class="header-right">
          <div id="quotaBadge" class="quota-badge" title="YouTube API quota usage">
            <span class="quota-label">Quota</span>
            <div class="quota-bar"><div id="quotaFill" class="quota-fill"></div></div>
            <span id="quotaText" class="quota-text">0 / 10,000</span>
          </div>
          <button id="favoritesToggle" class="header-icon-btn" title="View favorites">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            <span id="favCount" class="fav-count" style="display:none;">0</span>
          </button>
          <button id="viewToggle" class="header-icon-btn" title="Toggle grid/list view">
            <svg id="viewToggleIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
            </svg>
          </button>
          <span id="status" class="status-badge"></span>
        </div>
      </div>
    </header>

    <!-- Tab Bar: Live / Upcoming -->
    <nav class="tab-bar">
      <div class="tab-bar-inner">
        <button class="tab-btn active" data-tab="live">Live Now</button>
        <button class="tab-btn" data-tab="upcoming">Upcoming</button>
      </div>
    </nav>

    <section class="controls-section">
      <div class="controls-container">
        <!-- Search bar + action buttons -->
        <div class="search-row">
          <div class="search-group">
            <label class="input-label" for="keywords">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
              </svg>
              <input type="text" id="keywords" class="search-input" placeholder="Enter keywords (comma-separated)" />
            </label>
          </div>
          <button id="scanBtn" class="scan-button">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 4v6h6"></path>
              <path d="M23 20v-6h-6"></path>
              <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
            </svg>
            <span>Scan Now</span>
          </button>
          <button id="stopBtn" class="stop-button" style="display:none;">Stop</button>
        </div>

        <!-- Toolbar: Presets + Filters toggle + Refresh -->
        <div class="toolbar-row">
          <div class="toolbar-left">
            <div class="preset-group">
              <select id="presetSelect" class="select-input preset-select">
                <option value="">Presets...</option>
              </select>
              <button id="savePresetBtn" class="preset-btn" title="Save current search as preset">Save</button>
              <button id="deletePresetBtn" class="preset-btn preset-btn-danger" title="Delete selected preset">Del</button>
            </div>
            <button id="filtersToggle" class="filters-toggle-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                <line x1="4" y1="21" x2="4" y2="14"></line>
                <line x1="4" y1="10" x2="4" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12" y2="3"></line>
                <line x1="20" y1="21" x2="20" y2="16"></line>
                <line x1="20" y1="12" x2="20" y2="3"></line>
                <line x1="1" y1="14" x2="7" y2="14"></line>
                <line x1="9" y1="8" x2="15" y2="8"></line>
                <line x1="17" y1="16" x2="23" y2="16"></line>
              </svg>
              <span>Filters</span>
              <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
          </div>
          <div class="toolbar-right">
            <label class="select-label select-label-inline">
              <span class="label-text">Auto-refresh</span>
              <select id="refreshSec" class="select-input select-input-sm">
                <option value="0">Off</option>
                <option value="10">10s</option>
                <option value="20" selected>20s</option>
                <option value="30">30s</option>
                <option value="60">60s</option>
              </select>
            </label>
          </div>
        </div>

        <!-- Collapsible filters panel -->
        <div id="filtersPanel" class="filters-panel" style="display:none;">
          <div class="filter-group">
            <div class="filter-group-title">Search</div>
            <div class="filter-group-items">
              <label class="select-label">
                <span class="label-text">Results</span>
                <select id="max" class="select-input">
                  <option value="10">10</option>
                  <option value="25" selected>25</option>
                  <option value="50">50</option>
                </select>
              </label>
              <label class="select-label">
                <span class="label-text">Sort</span>
                <select id="sortOrder" class="select-input">
                  <option value="viewCount" selected>Most Viewers</option>
                  <option value="date">Newest</option>
                  <option value="relevance">Relevance</option>
                  <option value="rating">Rating</option>
                </select>
              </label>
              <label class="select-label">
                <span class="label-text">Safe Search</span>
                <select id="safeSearch" class="select-input">
                  <option value="none" selected>Off</option>
                  <option value="moderate">Moderate</option>
                  <option value="strict">Strict</option>
                </select>
              </label>
            </div>
          </div>
          <div class="filter-group">
            <div class="filter-group-title">Region & Language</div>
            <div class="filter-group-items">
              <label class="select-label">
                <span class="label-text">Region</span>
                <select id="region" class="select-input">
                  <option value="">Any</option>
                  <option value="US">US</option>
                  <option value="GB">UK</option>
                  <option value="CA">Canada</option>
                  <option value="AU">Australia</option>
                  <option value="DE">Germany</option>
                  <option value="FR">France</option>
                  <option value="JP">Japan</option>
                  <option value="KR">S. Korea</option>
                  <option value="BR">Brazil</option>
                  <option value="IN">India</option>
                  <option value="MX">Mexico</option>
                  <option value="ES">Spain</option>
                  <option value="IT">Italy</option>
                  <option value="RU">Russia</option>
                  <option value="PH">Philippines</option>
                </select>
              </label>
              <label class="select-label">
                <span class="label-text">Language</span>
                <select id="lang" class="select-input">
                  <option value="">Any</option>
                  <option value="en">English</option>
                  <option value="es">Spanish</option>
                  <option value="pt">Portuguese</option>
                  <option value="fr">French</option>
                  <option value="de">German</option>
                  <option value="ja">Japanese</option>
                  <option value="ko">Korean</option>
                  <option value="hi">Hindi</option>
                  <option value="ru">Russian</option>
                  <option value="it">Italian</option>
                  <option value="zh">Chinese</option>
                  <option value="ar">Arabic</option>
                  <option value="tl">Filipino</option>
                </select>
              </label>
              <label class="select-label">
                <span class="label-text">Category</span>
                <select id="topic" class="select-input">
                  <option value="">Any</option>
                  <option value="/m/0bzvm2">Gaming</option>
                  <option value="/m/04rlf">Music</option>
                  <option value="/m/06ntj">Sports</option>
                  <option value="/m/02jjt">Entertainment</option>
                  <option value="/m/019_rr">Lifestyle</option>
                  <option value="/m/01k8wb">Knowledge</option>
                  <option value="/m/098wr">Society</option>
                </select>
              </label>
            </div>
          </div>
          <div class="filter-group">
            <div class="filter-group-title">Viewers</div>
            <div class="filter-group-items">
              <label class="select-label">
                <span class="label-text">Min Viewers</span>
                <input type="number" id="minViewers" class="number-input" placeholder="0" min="0" value="0" />
              </label>
              <label class="select-label">
                <span class="label-text">Max Viewers</span>
                <input type="number" id="maxViewers" class="number-input" placeholder="No limit" min="0" value="0" />
              </label>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Favorites Panel (slide-in) -->
    <div id="favoritesOverlay" class="favorites-overlay" style="display:none;"></div>
    <aside id="favoritesPanel" class="favorites-panel">
      <div class="favorites-header">
        <h2 class="favorites-title">Favorite Streamers</h2>
        <button id="favoritesClose" class="favorites-close" title="Close">&times;</button>
      </div>
      <div id="favoritesList" class="favorites-list">
        <div class="favorites-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
          <p>No favorites yet</p>
          <span>Click the heart on any stream to save it here</span>
        </div>
      </div>
    </aside>

    <section id="blockedSection" class="blocked-section" style="display:none;">
      <div class="blocked-container">
        <div class="blocked-header">
          <h3 class="blocked-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
            </svg>
            Blocked Channels
          </h3>
          <button id="clearBlockedBtn" class="clear-blocked-btn">Clear All</button>
        </div>
        <div id="blockedList" class="blocked-list"></div>
      </div>
    </section>

    <main class="main-content">
      <div id="results" class="results-grid"></div>
    </main>

    <footer class="footer">
      <p>Powered by YouTube Data API v3</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
